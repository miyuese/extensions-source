name: Build Happymh

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Happymh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Happymh
        run: |
          ./gradlew :src:zh:happymh:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happymh-apk
          path: "**/happymh*.apk"
          retention-days: 7
